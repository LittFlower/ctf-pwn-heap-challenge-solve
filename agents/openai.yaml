interface:
  display_name: "CTF Heap Challenge Solve"
  short_description: "Version-aware glibc heap solver for overlap, double-free, no-free, leakless, FILE/libio, and modern endgame routes."
  default_prompt: "Use $ctf-pwn-heap-challenge-solve to solve this glibc heap pwn challenge by recovering allocator facts, mapping primitives such as UAF, double free, off-by-null overlap, largebin or other bin-metadata corruption, no-free top-chunk paths, leakless metadata abuse, pointer-router style stale-slot reuse, or writable FILE/stdin/stdout state to compatible how2heap or libio routes, separating local-only validation from real in-band leak routes, and preserving the split between redirected-fd stdio use through `_fileno`, historical old-libc `_IO_str_*` dispatch, modern FILE, and exit-linked endgames so the chosen route actually matches the shipped libc. Converge to one remotely usable exp file that self-recovers any required PIE, libc, heap, or stack bases instead of relying on /proc, debugger state, or io.libs()."
